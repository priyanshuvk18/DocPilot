# DocPilot API — Fly.io deployment config
# This file is a placeholder for Phase 0.
# Populate after you have a Fly.io account: `fly launch --copy-config`
# See README.md §Deployment for full instructions.

app = "docpilot-api"
primary_region = "sin"   # Singapore; change to your nearest region

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  ENVIRONMENT = "production"
  LOG_LEVEL    = "INFO"

# Secrets (never in this file — set via `fly secrets set KEY=value`):
#   ANTHROPIC_API_KEY, VOYAGE_API_KEY, DATABASE_URL, REDIS_URL
#   SUPABASE_URL, SUPABASE_JWT_SECRET, SENTRY_DSN, LANGFUSE_SECRET_KEY
#   STORAGE_ACCESS_KEY_ID, STORAGE_SECRET_ACCESS_KEY

[[services]]
  internal_port = 8000
  protocol      = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port     = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port     = 443

  [services.concurrency]
    type       = "connections"
    hard_limit = 500
    soft_limit = 400

  [[services.http_checks]]
    interval      = "15s"
    timeout       = "5s"
    grace_period  = "20s"
    method        = "GET"
    path          = "/v1/health"
    protocol      = "http"
    tls_skip_verify = false

[[vm]]
  cpu_kind = "shared"
  cpus     = 2
  memory   = "1gb"
